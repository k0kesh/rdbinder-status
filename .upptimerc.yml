owner: k0kesh
repo: rdbinder-status

sites:
  - name: Marketing site
    url: https://rdbinder.com
  - name: Marketing site (www)
    url: https://www.rdbinder.com
  - name: Sample binders
    url: https://rdbinder.com/sample
  - name: Order and review API
    url: https://api.rdbinder.com/health
  - name: AI crawler access (GEO canary)
    # GEO tripwire: answer-engine SEARCH crawlers must keep getting 200, or AI
    # citation silently dies. If Cloudflare Super Bot Fight Mode ("Block AI bots")
    # is ever enabled on this zone, the OAI-SearchBot user-agent gets 403 and this
    # check trips. Origin: the rdbinder.com SBFM incident 2026-06-01.
    url: https://rdbinder.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; OAI-SearchBot/1.0; +https://openai.com/searchbot)"
    expectedStatusCodes:
      - 200

status-website:
  cname: status.rdbinder.com
  name: R&D Binder Status
  introTitle: "R&D Binder service status"
  introMessage: "Uptime and response-time monitoring for R&D Binder's customer-facing services, checked every 5 minutes. Incidents are listed in the GitHub Issues tab."
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/k0kesh/rdbinder-status

assignees:
  - k0kesh
